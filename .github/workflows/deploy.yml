name: Build and deploy the archive

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci || npm install
        working-directory: site
      - name: Verify the committed data matches the tools that produce it
        # Thirteen tools need sources/*.ged, which is gitignored, so CI cannot
        # re-derive their output. It can check that nobody hand-edited a data
        # file or changed a tool without rerunning it: regen.py stamps every
        # derived file's hash at the last full regeneration. The gazetteer went
        # on quoting 232 Zubrinics for weeks after the count was fixed, and this
        # is what would have caught it.
        run: python3 tools/regen.py --check

      - name: Regenerate the derived data that does not need the GEDCOM
        # Eleven of twelve tools need sources/*.ged, which is gitignored because
        # it carries every living person in full. These three read committed
        # JSON only, and whoindex in particular is trusted at runtime by the
        # auto-linker - a stale slug there points a reader at a dead page.
        run: |
          python3 tools/register.py
          python3 tools/coverage.py
          python3 tools/whoindex.py
      - name: Build
        run: npm run build
        working-directory: site
      - name: Build the search index from the build, then rebuild with it
        run: |
          python3 tools/searchindex.py
          npm run build --prefix site
      - name: Check the archive before publishing it
        run: python3 tools/check_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
